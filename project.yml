name: Wijhati
options:
  bundleIdPrefix: com.hggdet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    branch: main
targets:
  Wijhati:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: MapLibre
        product: MapLibre
      - target: WijhatiWidget
        embed: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: وجهتي
        CFBundleName: Wijhati
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: يحتاج وجهتي إلى موقعك لعرضه على الخريطة وحساب المسارات إليك ومنك.
        NSLocationAlwaysAndWhenInUseUsageDescription: يحتاج وجهتي إلى موقعك في الخلفية لتنبيهات القرب وإرشاد الملاحة.
        NSCameraUsageDescription: يحتاج وجهتي إلى الكاميرا لعرض اتجاهات المشي فوق الصورة الحية (ملاحة بالكاميرا).
    entitlements:
      path: App/Wijhati.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hggdet.wijhati
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hggdet.wijhati
        PRODUCT_NAME: Wijhati
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.14.0"
        CURRENT_PROJECT_VERSION: "15"
        CODE_SIGN_STYLE: Manual
    preBuildScripts:
      - name: Decode App Icon
        script: |
          B64="$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png.b64"
          OUT="$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          if [ -f "$B64" ]; then base64 -D -i "$B64" -o "$OUT" 2>/dev/null || base64 --decode "$B64" > "$OUT"; fi
  WijhatiWidget:
    type: app-extension
    platform: iOS
    sources:
      - Widget
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: وجهتي سريع
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hggdet.wijhati.widget
        PRODUCT_NAME: WijhatiWidget
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.14.0"
        CURRENT_PROJECT_VERSION: "15"
        CODE_SIGN_STYLE: Manual
        SKIP_INSTALL: YES
    entitlements:
      path: Widget/WijhatiWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.hggdet.wijhati
schemes:
  Wijhati:
    build:
      targets:
        Wijhati: all
    run:
      config: Debug
    archive:
      config: Release
