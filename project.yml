name: Wijhati
options:
  bundleIdPrefix: com.hggdet
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    branch: main
targets:
  Wijhati:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: MapLibre
        product: MapLibre
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: وجهتي
        CFBundleName: Wijhati
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: يحتاج وجهتي إلى موقعك لعرضه على الخريطة وحساب المسارات إليك ومنك.
        NSLocationAlwaysAndWhenInUseUsageDescription: يحتاج وجهتي إلى موقعك في الخلفية لتنبيهات القرب وإرشاد الملاحة.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hggdet.wijhati
        PRODUCT_NAME: Wijhati
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "2"
        CODE_SIGN_STYLE: Manual
    preBuildScripts:
      - name: Decode App Icon
        script: |
          B64="$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png.b64"
          OUT="$SRCROOT/App/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          if [ -f "$B64" ]; then base64 -D -i "$B64" -o "$OUT" 2>/dev/null || base64 --decode "$B64" > "$OUT"; fi
schemes:
  Wijhati:
    build:
      targets:
        Wijhati: all
    run:
      config: Debug
    archive:
      config: Release
