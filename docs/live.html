<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>وجهتي — تتبع حي</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body, #map { height: 100%; margin: 0; }
  #bar { position: fixed; top: 10px; right: 10px; left: 10px; z-index: 1000;
         background: rgba(255,255,255,.85); backdrop-filter: blur(12px);
         border-radius: 14px; padding: 10px 14px; font-family: system-ui;
         display: flex; justify-content: space-between; align-items: center;
         box-shadow: 0 4px 18px rgba(0,0,0,.15); }
  #status { font-size: 14px; font-weight: 600; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #22c55e; display: inline-block; margin-left: 6px; }
</style>
</head>
<body>
<div id="bar"><span><span id="dot"></span><span id="status">جارٍ الاتصال…</span></span><span>وجهتي 📍</span></div>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const SUPABASE_URL = "WIJHATI_SUPABASE_URL";
const ANON_KEY = "WIJHATI_ANON_KEY";
const id = new URLSearchParams(location.search).get("s");
const map = L.map("map").setView([33.3152, 44.3661], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(map);
let marker = null, first = true;
async function tick() {
  const status = document.getElementById("status");
  if (!id || SUPABASE_URL.startsWith("WIJHATI")) { status.textContent = "رابط غير مكتمل"; return; }
  try {
    const r = await fetch(SUPABASE_URL + "/rest/v1/live_locations?id=eq." + encodeURIComponent(id) + "&select=*",
      { headers: { apikey: ANON_KEY, Authorization: "Bearer " + ANON_KEY } });
    const rows = await r.json();
    if (!rows.length) { status.textContent = "بانتظار أول موقع…"; return; }
    const row = rows[0];
    if (new Date(row.expires_at) < new Date()) { status.textContent = "انتهت المشاركة"; document.getElementById("dot").style.background = "#ef4444"; return; }
    const ll = [row.latitude, row.longitude];
    if (!marker) marker = L.marker(ll).addTo(map); else marker.setLatLng(ll);
    if (first) { map.setView(ll, 16); first = false; }
    status.textContent = "مباشر — آخر تحديث " + new Date(row.updated_at).toLocaleTimeString("ar-IQ");
  } catch (e) { status.textContent = "مشكلة اتصال، إعادة محاولة…"; }
}
tick(); setInterval(tick, 8000);
</script>
</body>
</html>
